name: Automated PostgreSQL Backup

on:
  schedule:
    # Runs at 20:30 UTC daily = 02:00 AM IST (India Standard Time)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypt and Upload Backup to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client, Age, and AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client age awscli
          pg_dump --version
          age --version
          aws --version

      - name: Execute Encrypted Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh
